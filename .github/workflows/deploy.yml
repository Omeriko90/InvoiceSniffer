name: Deploy to GCP

# On PRs: validate that the lockfile installs cleanly (npm ci), the same check
# the Docker build relies on — so a cross-platform lockfile gap fails the PR
# instead of a deploy. On merge to main: validate, then build both images,
# apply DB migrations, deploy the web service and update the worker job.
# Auth is keyless via Workload Identity Federation (see DEPLOY.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR runs; never cancel a main deploy mid-flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT_ID: invoicesniffer
  REGION: us-central1
  AR_REPO: us-central1-docker.pkg.dev/invoicesniffer/invoicesniffer
  WEB_SERVICE: invoicesniffer-web
  WORKER_JOB: invoicesniffer-worker

jobs:
  # Runs on every PR and every push. `npm ci` fails if package-lock.json is out
  # of sync with package.json (e.g. missing linux-only optional deps) — the same
  # failure the Docker build would hit, caught early.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (validates lockfile sync)
        run: npm ci

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' # only main pushes / manual dispatch deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/336612643167/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: deployer@invoicesniffer.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # --- Database migrations: must succeed before new code goes live ---
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        run: npx prisma migrate deploy
        env:
          # prisma.config.ts prefers DIRECT_URL (unpooled) for DDL.
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # --- Build & push images to Artifact Registry ---
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build & push web image
        run: |
          docker build -f Dockerfile.web \
            -t "$AR_REPO/web:$GITHUB_SHA" \
            -t "$AR_REPO/web:latest" .
          docker push "$AR_REPO/web:$GITHUB_SHA"
          docker push "$AR_REPO/web:latest"

      - name: Build & push worker image
        run: |
          docker build -f Dockerfile.worker \
            -t "$AR_REPO/worker:$GITHUB_SHA" \
            -t "$AR_REPO/worker:latest" .
          docker push "$AR_REPO/worker:$GITHUB_SHA"
          docker push "$AR_REPO/worker:latest"

      # --- Deploy: --image only, so existing env/secrets/SA are preserved ---
      - name: Deploy web service
        run: |
          gcloud run deploy "$WEB_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$AR_REPO/web:$GITHUB_SHA" --quiet

      - name: Update worker job image
        run: |
          gcloud run jobs update "$WORKER_JOB" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$AR_REPO/worker:$GITHUB_SHA" --quiet
